name: Build Word add-in package

on:
  push:
    branches: [feature/case-library-toggle]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Check Office developer tools
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $targets = Get-ChildItem -Path (Join-Path $vs 'MSBuild\Microsoft\VisualStudio') -Recurse -Filter 'Microsoft.VisualStudio.Tools.Office.targets' -ErrorAction SilentlyContinue
          if (-not $targets) { throw 'Office developer tools are not installed on this runner.' }
          $targets | ForEach-Object { Write-Host $_.FullName }

      - name: Create manifest signing certificate
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Subject 'CN=WordOllama Case Library Build' `
            -Type CodeSigningCert -KeyAlgorithm RSA -KeyLength 2048 -KeySpec Signature `
            -Provider 'Microsoft Enhanced RSA and AES Cryptographic Provider' `
            -KeyExportPolicy Exportable -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(10)
          Export-Certificate -Cert $cert -FilePath WordOllama.cer | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: |
          msbuild WordOllama.sln /t:Restore,Build /p:Configuration=Release /p:OpenSourceBuild=false `
            /p:SignManifests=true /p:ManifestCertificateThumbprint=${{ steps.cert.outputs.thumbprint }} `
            /p:SignAssembly=false /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }

      - name: Verify localization
        shell: pwsh
        run: ./tools/verify-localization.ps1

      - name: Package
        id: package
        shell: pwsh
        run: |
          $bin = 'WordOllama\bin\Release'
          foreach ($f in 'WordOllama.dll', 'WordOllama.vsto', 'WordOllama.dll.manifest') {
            if (-not (Test-Path (Join-Path $bin $f))) { throw "Missing build output: $f" }
          }
          $short = '${{ github.sha }}'.Substring(0, 7)
          $name = "WordOllama-CaseLibrary-$short"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Recurse $bin (Join-Path $stage 'WordOllama')
          Get-ChildItem (Join-Path $stage 'WordOllama') -Recurse -Filter *.pdb | Remove-Item
          Copy-Item WordOllama.cer, tools\package\* $stage
          Copy-Item LICENSE (Join-Path $stage 'LICENSE.txt')
          "source=https://github.com/${{ github.repository }}/tree/${{ github.sha }}" | Set-Content (Join-Path $stage 'SOURCE.txt')
          Compress-Archive -Path "$stage\*" -DestinationPath "$name.zip"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' '${{ steps.package.outputs.name }}.zip' `
            --repo '${{ github.repository }}' --title 'WordOllama 案例库测试版 ${{ github.ref_name }}' `
            --notes '下载 zip，解压后双击“安装.cmd”。详见压缩包内的“安装说明.txt”。'
